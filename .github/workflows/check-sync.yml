name: Conferir sincronia dos plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: core/ e plugins/<harness>/ estão iguais
        run: python3 scripts/sync_plugins.py --check
      - name: JSON dos manifestos e marketplaces é válido
        run: |
          for f in harnesses.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json plugins/*/*/plugin.json plugins/*/*/.claude-plugin/plugin.json core/*/plugin.core.json; do
            [ -f "$f" ] || continue
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done
