name: Publicar release dos plugins

# Roda quando a versão de um plugin muda em core/ (ou manualmente).
# Para cada plugin cuja tag <plugin>-v<versão> ainda não existe, cria a
# release com um ZIP por harness, pronto para upload no Claude ou no ChatGPT.

on:
  push:
    branches: [main]
    paths:
      - "core/*/plugin.core.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir sincronia antes de empacotar
        run: python3 scripts/sync_plugins.py --check

      - name: Empacotar
        id: pkg
        run: python3 scripts/package_plugins.py --out dist

      - name: Criar releases que ainda não existem
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.pkg.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag já existe, nada a fazer."
              continue
            fi
            plugin="${tag%-v*}"
            version="${tag##*-v}"
            notes=$(cat <<EOF
          Plugin \`$plugin\` versão $version.

          | Arquivo | Para |
          |---|---|
          | \`$plugin-claude-$version.zip\` | Claude: **Customize > Plugins** (pessoal) ou **Organization settings > Plugins & skills > Add > Upload a plugin** (organização) |
          | \`$plugin-codex-$version.zip\` | Codex e ChatGPT, quando não for usar o import pelo GitHub |

          No Claude Code, Codex e ChatGPT (import de marketplace) não é preciso baixar: instale direto do repositório, como descrito no README.
          EOF
          )
            gh release create "$tag" dist/"$plugin"-*-"$version".zip \
              --title "$plugin $version" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          done
